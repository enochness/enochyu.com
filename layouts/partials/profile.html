<section class="profile-section">
  <div id="profile-image">
    <img src="/img/profile.jpg" alt="profile">
  </div>

  <div class="profile-info">
    <h1 id="profile-name">Enoch Yu</h1>
    <p id="profile-description"></p>
    <div>
      <div id="social-icons">
        {{ with .Site.Params.social.youtube }}
        <a href="{{ . }}" target="_blank" rel="noopener"
           aria-label="YouTube">
          <i class="fab fa-youtube"></i>
        </a>
        {{ end }}
        {{ with .Site.Params.social.github }}
        <a href="{{ . }}" target="_blank" rel="noopener"
           class="icon-github" aria-label="GitHub">
          <i class="fab fa-github"></i>
        </a>
        {{ end }}
        {{ with .Site.Params.social.blog }}
        <a href="{{ . }}" target="_blank" rel="noopener"
           aria-label="Blog">
          <i class="fa-solid fa-blog"></i>
        </a>
        {{ end }}
        <button type="button" aria-expanded="false"
                aria-controls="email-reveal" id="reveal-email"
                aria-label="Click to reveal" title="Click to reveal">
          <i class="fa-solid fa-envelope"></i>
        </button>
      </div>
      <div id="email-reveal">
        <div class="email-reveal-inner">
          <div class="email-reveal-content">
            <div>enoch [at] enochyu [dot] com</div>
            <div>In case of an emergency, call 911</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
